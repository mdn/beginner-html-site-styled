name: CI con Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ github.sha }} .

      - name: Publicar imagen en Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ github.sha }}

      # AQUÍ EMPIEZA LA FASE 4 (Simulación de Servidor)
      - name: Simular descarga desde el servidor (Pull)
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ github.sha }}

      - name: Simular despliegue del contenedor (Run)
        run: docker run -d -p 8080:80 --name mi-app-produccion ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ github.sha }}

      - name: Prueba de Humo (Smoke Test)
        run: |
          echo "Esperando a que el contenedor arranque..."
          sleep 3
          curl -f http://localhost:8080 || exit 1
          echo "¡El servidor responde correctamente!"