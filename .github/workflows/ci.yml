name: CI con Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- NUEVO: Configuración de Buildx para Caché ---
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- NUEVO: Build y Push en un solo paso (con caché) ---
      - name: Construir y Publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # -------------------------------------------------

      - name: Simular descarga desde el servidor (Pull)
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ github.sha }}

      - name: Crear y ejecutar contenedor con Docker Compose
        run:  |
          export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/mi-app-html:${{ github.sha }}
          docker compose up -d

      - name: Verificar que el contenedor esté corriendo
        run: |
          echo "Esperando a que el contenedor esté listo..."
          sleep 3
          curl -f http://localhost:8080 || exit 1
          echo "¡El servidor responde correctamente!"

      - name: Limpieza de imágenes y contenedores viejos (Pruning)
        run: |
          echo "Simulando limpieza de servidor..."
          # En un servidor real, esto libera disco.
          docker image prune -af
          docker container prune -f

       
    